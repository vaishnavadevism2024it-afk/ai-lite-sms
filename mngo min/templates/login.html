{% extends "base.html" %}

{% block title %} - Login{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <h3 class="mt-3 fw-bold">AI-Lite SMS</h3>
            <p class="text-muted">Sign in to your account</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label fw-medium">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" name="username" required autofocus placeholder="admin/teacher/student">
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-medium">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Sign In <i class="fa-solid fa-arrow-right ms-2"></i></button>
        </form>
        
        <div class="mt-4 text-center">
            <small class="text-muted">Demo Credentials:</small><br>
            <small class="text-muted">admin / admin123 | teacher / teacher123 | student / student123</small>
        </div>
    </div>
</div>
{% endblock %}
